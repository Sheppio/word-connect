name: Deploy to GitHub Pages

# `main` is the published branch: the github-pages environment only accepts
# deployments from it. Merge or push work there to release it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Record which commit is live; the How to play sheet shows it.
      - name: Stamp build with commit
        run: |
          short="${GITHUB_SHA::8}"
          sed -i "s/^const APP_BUILD = .*/const APP_BUILD = '$short';/" version.js
          grep -q "const APP_BUILD = '$short';" version.js || {
            echo "::error::version.js was not stamped"; exit 1;
          }
          cat version.js

      # The site is plain static files — publish the repository root as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
