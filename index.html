<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101a5c">
<meta name="description" content="Drag related words into rows until every group is complete.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Word Connect</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
</head>
<body>

<div id="home" class="home" hidden>
  <div class="home-inner">
    <header class="home-head">
      <h1>Word Connect</h1>
      <p class="home-sub">Four word games. New puzzles every day.</p>
    </header>

    <div class="home-streak" id="home-streak" role="img">
      <svg class="flame" viewBox="0 0 24 24" aria-hidden="true">
        <path class="flame-outer" d="M13 2c.5 3.2-.9 4.6-2.4 6C8.7 9.7 7 11.4 7 14.3 7 18 9.2 21 12 21s5-3 5-6.7c0-2.3-1-4-2.1-5.5-.3 1-.9 1.8-1.6 2.3.7-3.4-.1-6.9-.3-9.1Z"/>
        <path class="flame-core" d="M12 12.4c.9 1 1.6 2 1.6 3.3 0 1.7-.7 2.9-1.6 2.9s-1.6-1.2-1.6-2.9c0-1.2.7-2.3 1.6-3.3Z"/>
      </svg>
      <p><strong id="home-streak-count">0</strong> day streak<br>
        <span class="home-streak-note" id="home-streak-note"></span></p>
    </div>

    <div class="home-games" id="home-games"></div>
    <p class="version" id="home-version"></p>
  </div>
</div>

<div id="app" hidden>

  <header class="topbar">
    <div class="bar-side">
      <button class="icon-btn" id="btn-menu" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.6 10.7 12 3.8l8.4 6.9"/>
          <path d="M6 9.8V20h12V9.8"/>
        </svg>
      </button>
      <div class="level-chip" aria-label="Puzzle number">
        <span class="level-chip-label">Puzzle</span>
        <span id="level-num">1</span>
      </div>
    </div>

    <div class="stats">
      <span id="timer">0:00</span>
      <span class="dim" aria-hidden="true">·</span>
      <span id="moves">0</span><span class="dim wordy" id="moves-label"> moves</span>
    </div>

    <div class="bar-side bar-right">
    <div class="streak" id="streak" role="img" aria-label="No streak yet">
      <svg class="flame" viewBox="0 0 24 24" aria-hidden="true">
        <path class="flame-outer" d="M13 2c.5 3.2-.9 4.6-2.4 6C8.7 9.7 7 11.4 7 14.3 7 18 9.2 21 12 21s5-3 5-6.7c0-2.3-1-4-2.1-5.5-.3 1-.9 1.8-1.6 2.3.7-3.4-.1-6.9-.3-9.1Z"/>
        <path class="flame-core" d="M12 12.4c.9 1 1.6 2 1.6 3.3 0 1.7-.7 2.9-1.6 2.9s-1.6-1.2-1.6-2.9c0-1.2.7-2.3 1.6-3.3Z"/>
      </svg>
      <span id="streak-count">0</span>
    </div>
    </div>
  </header>

  <main class="board-wrap">
    <div id="board" class="board"></div>
  </main>

  <footer class="toolbar">
    <button class="tool" id="btn-hint">
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .9 1.6l.1.6h5.2l.1-.6c.1-.6.4-1.2.9-1.6A6 6 0 0 0 12 3Z"/>
        <path d="M9.5 19h5M10.5 21.5h3"/>
      </svg>
      <span class="tool-label" id="hint-label">Hint</span>
      <span class="badge" id="hint-count">3</span>
    </button>
    <button class="tool" id="btn-shuffle">
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7h3.2c1 0 2 .5 2.6 1.4l5.4 7.2c.6.9 1.6 1.4 2.6 1.4H21"/>
        <path d="M3 17h3.2c1 0 2-.5 2.6-1.4l5.4-7.2c.6-.9 1.6-1.4 2.6-1.4H21"/>
        <path d="m18 4 3 3-3 3M18 14l3 3-3 3"/>
      </svg>
      <span class="tool-label" id="shuffle-label">Shuffle</span>
    </button>
    <button class="tool next" id="btn-next" hidden>
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12h13M12 5.5 18.5 12 12 18.5"/>
      </svg>
      <span class="tool-label">Next puzzle</span>
    </button>
  </footer>

</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet-wrap">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
    <p class="version" id="sheet-version" hidden></p>
  </div>
</div>

<div id="live" class="sr-only" aria-live="polite"></div>

<script src="version.js"></script>
<script src="data.js"></script>
<script src="confetti.js"></script>
<script src="share-card.js"></script>
<!-- modes register themselves as globals, so they load before the shell -->
<script src="mode-grid.js"></script>
<script src="mode-odd.js"></script>
<script src="mode-anagram.js"></script>
<script src="mode-chunks.js"></script>
<script src="app.js"></script>
</body>
</html>
